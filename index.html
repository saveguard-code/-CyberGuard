<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard & Media | Winter Collection</title>
    <style>
        /* Announcement Bar */
        .announcement-bar {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #ffffff;
            padding: 12px 20px;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            width: 100%;
            box-sizing: border-box;
        }

        .announcement-content {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .announcement-btn {
            background-color: #ffffff;
            color: #ff416c;
            padding: 5px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .announcement-btn:hover {
            background-color: #f1f1f1;
            color: #d32f2f;
            transform: translateY(-1px);
        }

        /* Base Styles */
        body {
            background-color: #0b111e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            background-color: #161f30;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .store-btn {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,176,155,0.3);
        }

        .store-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Top Announcement Bar -->
    <div class="announcement-bar">
        <div class="announcement-content">
            <span>🔥 Limited Time Offer: Exclusive Winter Collection Live Now!</span>
            <a href="https://www.redbubble.com/i/sweatshirt/Winter-Crafted-Cultures-Woven-Wisdom-by-Mr-seller1/185336626/du6s" target="_blank" rel="noopener noreferrer" class="announcement-btn">Shop Now 🛒</a>
        </div>
    </div>

    <div class="container">
        <!-- Header Section -->
        <h1>CyberGuard & Media</h1>
        <div class="subtitle">Digital Security & Exclusive Apparel Store</div>

        <!-- Store Featured Card -->
        <div class="card">
            <h3 style="margin-top: 0; color: #38bdf8; font-size: 18px;">Winter Edition Sweatshirt</h3>
            <p style="font-size: 13px; color: #94a3b8; line-height: 1.5;">Discover our premium quality winter apparel designed for ultimate comfort and style.</p>
            <a href="https://www.redbubble.com/i/sweatshirt/Winter-Crafted-Cultures-Woven-Wisdom-by-Mr-seller1/185336626/du6s" target="_blank" rel="noopener noreferrer" class="store-btn">Visit Official Store 🛍️</a>
        </div>

    </div>

</body>
</html>
